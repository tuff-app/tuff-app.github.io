name: Deploy

# Deploys the website, including the benchmark leaderboard, to
# tuff-app.github.io. The leaderboard is built from posts in the Benchmarks
# discussion category of tuff-app/TUFF, which reviews each post when it is made
# (its benchmark-review workflow). Discussions there can't start a workflow
# here without a stored token, so the site rebuilds every hour instead. Nothing
# in a post is ever executed; its JSON is read as data.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The leaderboard script and the benchmark suite live with the app.
      - uses: actions/checkout@v7
        with:
          repository: tuff-app/TUFF
          path: tuff
          persist-credentials: false
          sparse-checkout: |
            .github/benchmark-suite.json
            Scripts/benchmark_discussions.py
          sparse-checkout-cone-mode: false
      - name: Build the leaderboard data
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_REPOSITORY=tuff-app/TUFF python3 tuff/Scripts/benchmark_discussions.py build --output benchmarks/data.json
      - name: Collect the site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -R index.html assets benchmarks TUFF "$RUNNER_TEMP/site/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  # Deploying is its own job on purpose. Run straight after the upload in the
  # same job, deploy-pages sometimes lists the run's artifacts before the one
  # just uploaded shows up, and fails with "No artifacts named github-pages"
  # (actions/deploy-pages#451). A job that starts later finds it, and can try
  # again without uploading a second copy.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before trying again
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
